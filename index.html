<style>
  :root{
    --bg-ivory:#FAF9F6;
    --bg-ivory-deep:#F3F1EB;
    --ink:#2B2926;
    --ink-muted:#5C574F;
    --ink-faint:#8C8577;
    --line:#E6E2D9;
    --line-strong:#D3CDC0;
    --max:1400px;
    --gutter:clamp(20px,4vw,64px);
    --dur:650ms;
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg-ivory);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block;}
  /* ---------- Image protection (applies globally to every img, current
     and future — see also the delegated JS listeners near the end of the
     script, and draggable="false" on each <img> template) ---------- */
  img{
    -webkit-user-drag:none;
    -khtml-user-drag:none;
    -moz-user-drag:none;
    -o-user-drag:none;
    user-drag:none;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;padding:0;}

  ::selection{background:var(--ink);color:var(--bg-ivory);}

  /* focus visibility */
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:1.5px solid var(--ink);
    outline-offset:4px;
  }

  .serif{font-family:'Fraunces', serif;}
  .eyebrow{
    font-family:'Work Sans', sans-serif;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-muted);
    font-weight:500;
  }

  .seo-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;}

  /* ---------- Layout shells ---------- */
  .wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter);}

  header.site-header{
    position:fixed;top:0;left:0;right:0;
    z-index:100;
    background:transparent;
    border-bottom:1px solid transparent;
    transition:background-color 500ms var(--ease), border-color 500ms var(--ease);
  }
  header.site-header.scrolled{
    background:var(--bg-ivory);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--max);margin:0 auto;padding:34px var(--gutter) 22px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    transition:padding 500ms var(--ease);
  }
  .scrolled .header-inner{padding:20px var(--gutter) 16px;}
  .brand{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-style:normal;
    font-size:clamp(26px,3.6vw,42px);
    letter-spacing:.002em;
    line-height:1;
    white-space:nowrap;
    transition:font-size 500ms var(--ease);
  }
  .scrolled .brand{font-size:clamp(19px,2vw,24px);}
  .brand small{
    display:block;
    font-family:'Work Sans', sans-serif;
    font-style:normal;
    font-size:10px;
    letter-spacing:.28em;
    color:var(--ink-muted);
    font-weight:400;
    margin-top:8px;
    text-transform:uppercase;
    transition:opacity 400ms var(--ease), margin 400ms var(--ease), font-size 400ms var(--ease);
  }
  .scrolled .brand small{opacity:0;margin-top:0;font-size:0;}
  nav.main-nav{
    display:flex;gap:clamp(16px,2.4vw,34px);
    font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
    padding-bottom:4px;
  }
  nav.main-nav .nav-item{position:relative;}
  nav.main-nav .nav-item::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:100%;
    height:18px;
  }
  nav.main-nav a, nav.main-nav .nav-label{
    padding:6px 0;display:inline-block;position:relative;
    color:var(--ink-muted);
    transition:color .3s var(--ease);
    cursor:pointer;
  }
  nav.main-nav a.active, nav.main-nav a:hover, nav.main-nav .nav-label:hover{color:var(--ink);}
  nav.main-nav a::after{
    content:'';position:absolute;left:0;right:0;bottom:2px;height:1px;
    background:var(--ink);transform:scaleX(0);transform-origin:left;
    transition:transform .35s var(--ease);
  }
  nav.main-nav a.active::after, nav.main-nav a:hover::after{transform:scaleX(1);}

  .sub-panel{
    position:absolute;top:100%;left:-16px;margin-top:0;
    padding:14px 18px;
    display:none;flex-direction:column;gap:10px;min-width:190px;
    background:rgba(250,249,246,.86);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid rgba(220,213,201,.7);
  }
  .nav-item:hover .sub-panel, .nav-item:focus-within .sub-panel{display:flex;}
  .sub-panel a{color:var(--ink-muted);font-size:11.5px;letter-spacing:.06em;}
  .sub-panel a:hover{color:var(--ink);}

  .menu-toggle{display:none;}

  main{padding-top:0;}

  /* ---------- Mobile navigation (mobile only — desktop nav above is untouched) ---------- */
  @media (max-width:760px){
    .header-inner{align-items:center;}

    .menu-toggle{
      display:inline-flex;align-items:center;justify-content:center;
      width:30px;height:30px;padding:0;
      background:none;border:none;cursor:pointer;
      z-index:110;position:relative;
    }
    .menu-toggle-bars{
      display:inline-flex;flex-direction:column;justify-content:center;gap:5px;width:20px;
    }
    .menu-toggle-bars span{
      display:block;height:1px;width:100%;background:var(--ink);
      transition:transform .35s var(--ease), opacity .25s var(--ease);
    }
    header.site-header.nav-open .menu-toggle-bars span:nth-child(1){transform:translateY(6px) rotate(45deg);}
    header.site-header.nav-open .menu-toggle-bars span:nth-child(2){opacity:0;}
    header.site-header.nav-open .menu-toggle-bars span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}

    nav.main-nav{
      position:fixed;top:0;left:0;right:0;bottom:0;z-index:105;
      flex-direction:column;align-items:flex-start;justify-content:center;
      gap:28px;
      background:var(--bg-ivory);
      padding:110px var(--gutter) 70px;
      font-size:16px;
      overflow-y:auto;
      opacity:0;visibility:hidden;pointer-events:none;
      transform:translateY(-10px);
      transition:opacity .4s var(--ease), transform .4s var(--ease), visibility 0s linear .4s;
    }
    header.site-header.nav-open nav.main-nav{
      opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0);
      transition:opacity .4s var(--ease), transform .4s var(--ease), visibility 0s linear 0s;
    }
    nav.main-nav .nav-item{width:100%;}
    nav.main-nav a, nav.main-nav .nav-label{
      padding:12px 0;font-size:16px;display:block;width:100%;
    }
    .sub-panel{
      position:static;display:flex !important;flex-direction:column;
      padding:6px 0 4px 20px;gap:14px;min-width:0;margin-top:0;
      background:transparent;border:none;-webkit-backdrop-filter:none;backdrop-filter:none;
    }
    .sub-panel a{font-size:14px;padding:0;}

    body.menu-open{overflow:hidden;}
  }

  footer.site-footer{
    border-top:1px solid var(--line);
    margin-top:120px;
    padding:36px var(--gutter) 48px;
  }
  .footer-inner{
    max-width:var(--max);margin:0 auto;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
    font-size:11.5px;letter-spacing:.06em;color:var(--ink-muted);
    text-transform:uppercase;
  }
  .footer-inner .social a{margin-left:20px;}
  .footer-inner .social a:hover{color:var(--ink);}

  /* ---------- Fade-in on scroll ---------- */
  .reveal{opacity:0;transform:translateY(22px);transition:opacity 900ms var(--ease), transform 900ms var(--ease);}
  .reveal.is-visible{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;transition:none;}
    html{scroll-behavior:auto;}
  }

  /* ---------- View transition ---------- */
  #app{opacity:1;transition:opacity 420ms ease;min-height:70vh;}
  #app.leaving{opacity:0;}

  /* ---------- Home hero spacer ---------- */
  .home-top-space{height:min(16vh,130px);}

  /* ---------- Editorial grid ---------- */
  .sequence{
    max-width:var(--max);margin:0 auto;padding:0 var(--gutter);
    display:grid;grid-template-columns:repeat(12,1fr);
    column-gap:var(--gutter);row-gap:clamp(40px,7vw,96px);
    margin-bottom:clamp(40px,7vw,96px);
    align-items:start;
  }
  .tile{position:relative;}
  /* aspect-ratio is set inline per-photo (from the CMS "Shape" field) so the
     browser reserves the exact box before the image loads — this is what
     prevents layout shift. object-fit:contain means the photo is never
     cropped: whatever doesn't fill the box just letterboxes, centered. */
  .tile-frame{
    position:relative;
    overflow:hidden;
    background:transparent;
    width:100%;
}

.tile-frame img{
    width:100%;
    height:auto;
    display:block;
    filter:grayscale(18%) sepia(6%) contrast(.98) brightness(1.02);
    transition:transform 1.1s var(--ease);
}
  .tile a{display:block;cursor:pointer;}
  .tile a:hover .tile-frame img{transform:scale(1.035);}

  /* Solo = full editorial width. Pair = two side by side.
     Which one a photo gets is decided automatically from its Shape:
     wide/landscape shapes read well full-width; square/portrait shapes
     pair up two at a time, magazine-spread style. */
  .tile--solo{grid-column:1/13;}
  .tile--pairL{grid-column:1/7;}
  .tile--pairR{grid-column:7/13;}
  .tile--pair-low{margin-top:clamp(40px,9vw,120px);}

  .tile-caption{
    margin-top:14px;display:flex;justify-content:space-between;gap:16px;
    font-size:11.5px;color:var(--ink-muted);letter-spacing:.04em;
  }
  .tile-caption .t-title{font-family:'Fraunces', serif;font-style:italic;font-size:15px;color:var(--ink);letter-spacing:0;}
  .tile-caption .t-meta{white-space:nowrap;text-transform:uppercase;padding-top:2px;}

  /* Desktop safety cap: no single photo should ever exceed one screen's height.
     The box height comes from the CMS-set aspect-ratio (capped at 82vh); the
     image is then fit inside that box with object-fit:contain so it always
     shows in its own native ratio, never cropped — it letterboxes instead. */
  @media (min-width:861px){
    .tile-frame{max-height:82vh;}
    .tile-frame img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
    }
  }

  @media (max-width:860px){
    .sequence{row-gap:56px;}
    .tile--solo,.tile--pairL,.tile--pairR,.tile--pair-low{
      grid-column:1/13;margin-top:0;
    }
  }

  /* ---------- Page intros ---------- */
  .page-hero{
    padding:190px var(--gutter) 60px;
    max-width:var(--max);margin:0 auto;
  }
  .page-hero .eyebrow{margin-bottom:18px;}
  .page-hero h1{
    font-family:'Fraunces', serif;font-weight:400;font-style:italic;
    font-size:clamp(34px,5.4vw,66px);line-height:1.05;margin:0 0 22px;
    max-width:16ch;
  }
  .page-hero p{
    font-size:15px;line-height:1.8;color:var(--ink-muted);max-width:52ch;margin:0;
  }

  /* ---------- Work index ---------- */
  .work-index{
    max-width:var(--max);margin:0 auto;padding:190px var(--gutter) 40px;
  }
  .work-index-list{margin-top:40px;}
  .work-row{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:34px 0;border-top:1px solid var(--line);
    transition:padding-left .4s var(--ease);
  }
  .work-row:last-child{border-bottom:1px solid var(--line);}
  .work-row a{display:flex;align-items:baseline;justify-content:space-between;width:100%;}
  .work-row h2{
    font-family:'Fraunces', serif;font-weight:400;font-size:clamp(26px,4vw,44px);margin:0;
    transition:transform .45s var(--ease);
  }
  .work-row:hover h2{transform:translateX(14px);}
  .work-row .count{font-size:11.5px;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase;}

  /* ---------- Individual image page ---------- */
  .artwork{
    max-width:var(--max);margin:0 auto;padding:172px var(--gutter) 0;
  }
.artwork-image{
    background:transparent;
    overflow:hidden;
    margin-bottom:36px;
}

.artwork-image img{
    width:100%;
    height:auto;
    display:block;
    filter:grayscale(18%) sepia(6%) contrast(.98) brightness(1.02);
}
  @media (min-width:861px){
    .artwork-image{max-height:80vh;}
  }
  .artwork-meta-row{
    display:grid;grid-template-columns:1.3fr .7fr;gap:60px;
    padding-bottom:100px;border-bottom:1px solid var(--line);margin-bottom:70px;
  }
  .artwork-title{font-family:'Fraunces', serif;font-style:italic;font-weight:400;font-size:clamp(26px,3.4vw,38px);margin:0 0 10px;}
  .artwork-location{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:26px;}
  .artwork-desc{font-size:15px;line-height:1.85;color:var(--ink-muted);max-width:56ch;}
  .artwork-side dl{margin:0 0 30px;}
  .artwork-side dt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px;}
  .artwork-side dd{margin:0 0 18px;font-size:13.5px;color:var(--ink);}
  .print-btn{
    display:inline-block;padding:15px 26px;border:1px solid var(--ink);
    font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
    transition:background .3s var(--ease), color .3s var(--ease);
  }
  .print-btn:hover{background:var(--ink);color:var(--bg-ivory);}
  .back-link{
    display:inline-block;margin-bottom:40px;font-size:11.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-muted);
  }
  .back-link:hover{color:var(--ink);}
  @media (max-width:760px){
    .artwork-meta-row{grid-template-columns:1fr;gap:36px;padding-bottom:60px;}
  }

  /* ---------- About ---------- */
  .about-wrap{max-width:900px;margin:0 auto;padding:190px var(--gutter) 40px;}
  .about-portrait{
    aspect-ratio:4/5;max-width:420px;background:var(--line);overflow:hidden;margin-bottom:56px;
  }
  .about-portrait img{width:100%;height:100%;object-fit:cover;filter:grayscale(22%) sepia(6%) contrast(.98);}
  .about-wrap h1{font-family:'Fraunces', serif;font-style:italic;font-weight:400;font-size:clamp(28px,4vw,44px);margin:0 0 34px;}
  .about-wrap p{font-size:16px;line-height:1.95;color:var(--ink-muted);margin:0 0 26px;max-width:60ch;}
  .about-wrap p:first-of-type::first-letter{
    font-family:'Fraunces', serif;font-size:3.4em;float:left;line-height:.8;padding-right:10px;padding-top:6px;color:var(--ink);
  }

  /* ---------- Prints page ---------- */
  .prints-wrap{max-width:var(--max);margin:0 auto;padding:190px var(--gutter) 40px;}
  .prints-body{display:grid;grid-template-columns:1.1fr .9fr;gap:80px;padding-bottom:80px;align-items:start;}
  .prints-body p{font-size:15.5px;line-height:1.9;color:var(--ink-muted);margin:0 0 22px;max-width:56ch;}
  .prints-note{
    border:1px solid var(--line);padding:32px;font-size:13px;line-height:1.8;color:var(--ink-muted);
  }
  .prints-note .eyebrow{margin-bottom:14px;}
  @media (max-width:860px){.prints-body{grid-template-columns:1fr;gap:40px;}}

  /* ---------- Contact ---------- */
  .contact-wrap{max-width:760px;margin:0 auto;padding:190px var(--gutter) 40px;}
  .contact-wrap h1{font-family:'Fraunces', serif;font-style:italic;font-weight:400;font-size:clamp(28px,4vw,44px);margin:0 0 20px;}
  .contact-wrap > p{font-size:15px;line-height:1.8;color:var(--ink-muted);margin:0 0 56px;max-width:52ch;}
  .field{margin-bottom:30px;}
  .field label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;}
  .field input, .field textarea, .field select{
    width:100%;border:none;border-bottom:1px solid var(--line-strong);
    background:transparent;font-family:'Work Sans', sans-serif;font-size:15px;color:var(--ink);
    padding:8px 0;font-weight:300;border-radius:0;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-bottom-color:var(--ink);}
  .field textarea{resize:vertical;min-height:100px;}
  .field select{
    -webkit-appearance:none;-moz-appearance:none;appearance:none;
    cursor:pointer;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%235C574F"/></svg>');
    background-repeat:no-repeat;background-position:right 2px center;background-size:10px 6px;
    padding-right:20px;
  }
  .field select:invalid{color:var(--ink-faint);}
  .contact-submit{margin-top:10px;transition:opacity .3s var(--ease);}
  .contact-submit[disabled]{opacity:.5;cursor:default;}
  .contact-direct{
    margin-top:70px;padding-top:36px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;
  }
  .contact-direct .eyebrow{margin-bottom:8px;}
  .contact-direct a{font-size:15px;}
  .contact-direct a:hover{color:var(--ink-muted);}

  .form-note{font-size:12px;color:var(--ink-faint);margin-top:16px;font-style:italic;}
  .form-note--error{color:#8B4A3B;font-style:normal;}

  .contact-success h2{
    font-family:'Fraunces', serif;font-style:italic;font-weight:400;
    font-size:clamp(24px,3vw,32px);margin:14px 0 14px;
  }
  .contact-success p{font-size:15px;line-height:1.85;color:var(--ink-muted);max-width:48ch;margin:0;}
</style>

      <a href="https://www.instagram.com/apecardphoto" target="_blank" rel="noopener">Instagram</a>
    </span>
  </div>
</footer>

<script>
/* =====================================================================
   CONTENT LAYER — populated at runtime from content.json (see init()
   below). Every render function below just reads from COLLECTIONS / SITE
   once they've been filled in.
===================================================================== */

let COLLECTIONS = {};
let SITE = {
  aboutPortrait: "images/profile.jpg",
  aboutHeading: "About",
  aboutText: "",
  printsHeading: "Prints",
  printsIntro: "",
  printsNote: "",
  contactHeading: "Get in touch.",
  contactIntro: ""
};

/* =====================================================================
   RENDER HELPERS
===================================================================== */

// A photo's "aspectRatio" (set per-photo in the CMS, e.g. "4 / 5") decides
// two things at once: the box it reserves before it loads (no layout
// shift), and whether it stands alone full-width or pairs up with the
// next photo. Wide/landscape shapes read well full-width; square/portrait
// shapes pair up two at a time.
function ratioValue(aspectRatio){
  const parts = String(aspectRatio || "4 / 5").split('/').map(n => parseFloat(n));
  if(parts.length === 2 && parts[1]) return parts[0] / parts[1];
  return 0.8;
}
function isPairable(photo){
  return ratioValue(photo.aspectRatio) < 1.15;
}

function paragraphs(text){
  if(!text) return '';
  return String(text)
    .split(/\n\s*\n/)
    .map(p => p.trim())
    .filter(Boolean)
    .map(p => `<p>${p}</p>`)
    .join('');
}

function tileMarkup(photo, mode, opts={}){
  const { lowOffset=false, isHero=false } = opts;
  const modifier = mode === 'solo' ? 'tile--solo' : (mode === 'pairL' ? 'tile--pairL' : 'tile--pairR');
  const lowClass = lowOffset ? ' tile--pair-low' : '';
  const ratio = photo.aspectRatio || '4 / 5';
  const altText = [photo.title, photo.location].filter(Boolean).join(', ');
  const imgAttrs = isHero
    ? `loading="eager" fetchpriority="high" decoding="async"`
    : `loading="lazy" decoding="async"`;

  return `
    <div class="tile ${modifier}${lowClass} reveal">
      <a href="#/work/${photo.collectionKey}/${photo.id}" data-link>
        <div class="tile-frame" style="aspect-ratio:${ratio};">
          <img src="${photo.image}" alt="${altText}" width="1200" height="${Math.round(1200 / ratioValue(ratio))}" ${imgAttrs} draggable="false">
        </div>
      </a>
      <div class="tile-caption">
        <span class="t-title">${photo.title || ''}</span>
        <span class="t-meta">${photo.location.split(',')[0]} — ${photo.year}</span>
      </div>
    </div>`;
}

// Shared by the homepage and every collection page: lays a list of photos
// out solo/paired based on shape, alternating which side of a pair sits
// lower for editorial rhythm. First item can be marked as the LCP hero.
function renderSequence(photos, opts={}){
  const { heroFirst=false } = opts;
  let html = '';
  let pairCount = 0;
  let i = 0;
  while(i < photos.length){
    const cur = photos[i];
    const isHero = heroFirst && i === 0;
    if(!isPairable(cur)){
      html += tileMarkup(cur, 'solo', { isHero });
      i += 1;
      continue;
    }
    const next = photos[i+1];
    if(next && isPairable(next)){
      const leftLow = pairCount % 2 === 1;
      pairCount++;
      html += tileMarkup(cur, 'pairL', { lowOffset:leftLow, isHero });
      html += tileMarkup(next, 'pairR', { lowOffset:!leftLow });
      i += 2;
    } else {
      // an unmatched square/portrait photo reads better solo than as a
      // narrow half-width orphan
      html += tileMarkup(cur, 'solo', { isHero });
      i += 1;
    }
  }
  return html;
}

function renderHome(){
  const featured = [];
  Object.values(COLLECTIONS).forEach(c => {
    c.photos.forEach(p => {
      if(p.featured){
        featured.push({ ...p, collectionKey: c.slug });
      }
    });
  });
  featured.sort((a, b) => (a.homepageOrder ?? 999) - (b.homepageOrder ?? 999));

  return `<div class="home-top-space"></div><h1 class="seo-only">Alexander Pécard-Leese — Fine Art Photography</h1><section class="sequence" aria-label="Featured photography">${renderSequence(featured, { heroFirst:true })}</section>`;
}

function renderWorkIndex(){
  const rows = Object.values(COLLECTIONS).map(c => `
    <div class="work-row reveal">
      <a href="#/work/${c.slug}" data-link>
        <h2 class="serif">${c.title}</h2>
        <span class="count">${String(c.photos.length).padStart(2,'0')} works</span>
      </a>
    </div>`).join('');

  return `
    <div class="page-hero reveal">
      <div class="eyebrow">Work</div>
      <h1 class="serif">Three bodies of work, ongoing.</h1>
      <p>Each collection is its own study — of people, of places, of machines built by hand. None are finished; all are added to as the work continues.</p>
    </div>
    <section class="work-index-list wrap" aria-label="Photography collections">${rows}</section>
    <div style="height:60px"></div>
  `;
}

function renderCollection(slug){
  const c = COLLECTIONS[slug];
  if(!c) return renderNotFound();

  const photos = c.photos.map(p => ({ ...p, collectionKey: slug }));

  return `
    <div class="page-hero reveal">
      <div class="eyebrow">Work — ${c.title}</div>
      <h1 class="serif">${c.title}</h1>
      <p>${c.intro}</p>
    </div>
    <section class="sequence" aria-label="${c.title} photography">${renderSequence(photos, { heroFirst:true })}</section>
    <div style="height:40px"></div>
  `;
}

function renderArtwork(collectionKey, photoId){
  const c = COLLECTIONS[collectionKey];
  if(!c) return renderNotFound();
  const photo = c.photos.find(p => p.id === photoId);
  if(!photo) return renderNotFound();

  const altText = [photo.title, photo.location].filter(Boolean).join(', ');
  const showPrint = photo.printAvailable !== false && photo.printLink;

  return `
    <article class="artwork">
      <a class="back-link reveal" href="#/work/${collectionKey}" data-link>&larr; ${c.title}</a>
      <div class="artwork-image reveal" style="aspect-ratio:${photo.aspectRatio || '4 / 5'};">
        <img src="${photo.image}" alt="${altText}" loading="eager" fetchpriority="high" decoding="async" draggable="false">
      </div>
      <div class="artwork-meta-row reveal">
        <div class="artwork-main">
          ${photo.title ? `<h1 class="artwork-title">${photo.title}</h1>` : ``}
          <div class="artwork-location">${photo.location} — ${photo.year}</div>
          ${photo.description ? `<p class="artwork-desc">${photo.description}</p>` : ``}
        </div>
        <div class="artwork-side">
          <dl>
            <dt>Camera</dt><dd>${photo.camera}</dd>
            <dt>Lens</dt><dd>${photo.lens}</dd>
            <dt>Collection</dt><dd>${c.title}</dd>
          </dl>
          ${showPrint ? `
          <div class="eyebrow" style="margin-bottom:14px;">Available as a fine-art print</div>
          <a class="print-btn" href="${photo.printLink}" target="_blank" rel="noopener">View Print Options</a>
          ` : ``}
        </div>
      </div>
    </article>
  `;
}

function renderAbout(){
  return `
    <section class="about-wrap" aria-labelledby="about-heading">
      <div class="about-portrait reveal" style="aspect-ratio:4/5;">
        <img src="${SITE.aboutPortrait}" alt="Alexander Pécard-Leese" loading="eager" fetchpriority="high" decoding="async" draggable="false">
      </div>
      <h1 class="reveal" id="about-heading">${SITE.aboutHeading}</h1>
      <div class="reveal">
        ${paragraphs(SITE.aboutText)}
      </div>
    </section>
  `;
}

function renderPrints(){
  return `
    <section class="prints-wrap" aria-labelledby="prints-heading">
      <div class="page-hero reveal" style="padding:0 0 50px;">
        <div class="eyebrow">Prints</div>
        <h1 class="serif" id="prints-heading">${SITE.printsHeading}</h1>
      </div>
      <div class="prints-body">
        <div class="reveal">
          ${paragraphs(SITE.printsIntro)}
          <a class="print-btn" href="https://apecardphoto.darkroom.com/" target="_blank" rel="noopener" style="margin-top:8px;">Explore Prints</a>
        </div>
        <div class="prints-note reveal">
          <div class="eyebrow">Please note</div>
          ${SITE.printsNote}
        </div>
      </div>
    </section>
  `;
}

function renderContact(){
  return `
    <section class="contact-wrap" aria-labelledby="contact-heading">
      <h1 class="reveal" id="contact-heading">${SITE.contactHeading}</h1>
      <p class="reveal">${SITE.contactIntro}</p>

      <form class="reveal" id="contactForm" action="https://formspree.io/f/xeeyneoy" method="POST">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="inquiryType">Inquiry Type</label>
          <select id="inquiryType" name="inquiry_type" required>
            <option value="" disabled selected hidden>Select one</option>
            <option value="Print Purchase">Print purchase</option>
            <option value="Commission / Assignment">Commission / assignment</option>
            <option value="Press / Publication">Press / publication</option>
            <option value="General Inquiry">General inquiry</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <input type="hidden" name="_subject" value="New inquiry — Alexander Pécard-Leese">
        <input type="text" name="_gotcha" style="position:absolute;left:-9999px;" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button type="submit" class="print-btn contact-submit">Send Message</button>
        <div class="form-note" id="formNote" role="status" aria-live="polite" style="display:none;"></div>
      </form>

      <div class="contact-success reveal" id="contactSuccess" role="status" aria-live="polite" hidden>
        <div class="eyebrow">Message sent</div>
        <h2>Thank you.</h2>
        <p>Your note has been received. I read every message personally and will reply as soon as I can.</p>
      </div>

      <div class="contact-direct reveal">
        <div>
          <div class="eyebrow">Email</div>
          <a href="mailto:apecardphoto@gmail.com">apecardphoto@gmail.com</a>
        </div>
      </div>
    </section>
  `;
}

function renderNotFound(){
  return `<div class="page-hero reveal"><h1 class="serif">Page not found.</h1><p><a href="#/" data-link>Return home</a></p></div>`;
}

/* =====================================================================
   ROUTER
===================================================================== */
const app = document.getElementById('app');

function parseRoute(){
  const hash = location.hash.replace(/^#/, '') || '/';
  const parts = hash.split('/').filter(Boolean);
  return parts;
}

  function render() {
    // A clicked nav/submenu link keeps browser focus after the route changes
    if (document.activeElement && document.activeElement !== document.body) {
      document.activeElement.blur();
    }

    const parts = parseRoute();
    let html = '';

    if (parts.length === 0) {
      html = renderHome();
      document.title = 'Alexander Pécard-Leese — Photography';
    } else if (parts[0] === 'work' && parts.length === 1) {
      html = renderWorkIndex();
      document.title = 'Work — Alexander Pécard-Leese';
    } else if (parts[0] === 'work' && parts.length === 2) {
      html = renderCollection(parts[1]);
      const c = COLLECTIONS[parts[1]];
      document.title = (c ? c.title : 'Work') + ' — Alexander Pécard-Leese';
    } else if (parts[0] === 'work' && parts.length === 3) {
      html = renderArtwork(parts[1], parts[2]);
      const c = COLLECTIONS[parts[1]];
      const photo = c && c.photos.find(p => p.id === parts[2]);
      document.title = (photo && photo.title ? photo.title : 'Artwork') + ' — Alexander Pécard-Leese';
    } else if (parts[0] === 'prints') {
      html = renderPrints();
      document.title = 'Prints — Alexander Pécard-Leese';
    } else if (parts[0] === 'about') {
      html = renderAbout();
      document.title = 'About — Alexander Pécard-Leese';
    } else if (parts[0] === 'contact') {
      html = renderContact();
      document.title = 'Contact — Alexander Pécard-Leese';
    } else {
      html = renderNotFound();
      document.title = 'Page Not Found — Alexander Pécard-Leese';
    }

    app.innerHTML = html;
    updateActiveNav(parts);
    attachScrollReveal();
    attachCaptionAlignment();
    attachContactForm();
    window.scrollTo(0, 0);
    document.querySelector('header.site-header').classList.remove('scrolled');
  }

function navigateWithTransition(){
  app.classList.add('leaving');
  setTimeout(() => {
    render();
    app.classList.remove('leaving');
  }, 220);
}

function updateActiveNav(parts){
  const route = '/' + parts.join('/');
  document.querySelectorAll('nav.main-nav a[data-route]').forEach(a => {
    const r = a.getAttribute('data-route');
    a.classList.toggle('active', r === route || (r !== '/' && route.startsWith(r)));
  });
}

// ---------------------------------------------------------------------
// Caption alignment fix
// .tile-caption normally spans the full width of .tile-frame, which is
// fine as long as the rendered photo actually fills that width. But
// .tile-frame's box is reserved from the CMS "Shape" field (and, on
// desktop, height-capped at 82vh) while the image itself is fit inside
// with object-fit:contain — so whenever the box's proportions and the
// photo's real proportions diverge (a height-capped box, an aspect-ratio
// field that doesn't quite match the file, or an unmatched photo that
// falls back to a full-width "solo" box), the visible photo pillarboxes
// narrower than the box and the caption no longer lines up with it.
// This measures the true rendered width of the photo inside its box
// (the same math the browser uses for object-fit:contain) and locks the
// caption to exactly that width, centered — so title/date always sit at
// the actual left/right edges of the image itself, not the reserved box.
// On mobile the image always fills the box (no cap, no contain), so no
// adjustment is made there.
function alignTileCaption(tile){
  if(!tile) return;
  const frame = tile.querySelector('.tile-frame');
  const img = frame && frame.querySelector('img');
  const caption = tile.querySelector('.tile-caption');
  if(!frame || !img || !caption) return;

  const desktopMode = window.matchMedia('(min-width:861px)').matches;
  const frameW = frame.clientWidth;
  const frameH = frame.clientHeight;

  if(!desktopMode || !img.naturalWidth || !img.naturalHeight || !frameW || !frameH){
    caption.style.width = '';
    caption.style.marginLeft = '';
    caption.style.marginRight = '';
    return;
  }

  const scale = Math.min(frameW / img.naturalWidth, frameH / img.naturalHeight);
  const displayedWidth = img.naturalWidth * scale;

  if(displayedWidth >= frameW - 0.5){
    caption.style.width = '';
    caption.style.marginLeft = '';
    caption.style.marginRight = '';
  } else {
    caption.style.width = displayedWidth + 'px';
    caption.style.marginLeft = 'auto';
    caption.style.marginRight = 'auto';
  }
}

const captionResizeObserver = ('ResizeObserver' in window)
  ? new ResizeObserver(entries => {
      entries.forEach(entry => alignTileCaption(entry.target.closest('.tile')));
    })
  : null;

function attachCaptionAlignment(){
  document.querySelectorAll('.tile').forEach(tile => {
    const frame = tile.querySelector('.tile-frame');
    const img = frame && frame.querySelector('img');
    if(!frame || !img) return;

    if(captionResizeObserver){
      captionResizeObserver.observe(frame);
    } else {
      window.addEventListener('resize', () => alignTileCaption(tile), { passive:true });
    }

    if(img.complete){
      alignTileCaption(tile);
    } else {
      img.addEventListener('load', () => alignTileCaption(tile), { once:true });
    }
  });
}

function attachScrollReveal(){
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){
    els.forEach(el => el.classList.add('is-visible'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  els.forEach(el => io.observe(el));
}

function attachContactForm(){
  const form = document.getElementById('contactForm');
  if(!form) return;

  const submitBtn = form.querySelector('.contact-submit');
  const noteEl = document.getElementById('formNote');
  const successEl = document.getElementById('contactSuccess');
  const submitBtnDefaultLabel = submitBtn.textContent;

  function showNote(message, isError){
    noteEl.textContent = message;
    noteEl.classList.toggle('form-note--error', !!isError);
    noteEl.style.display = message ? 'block' : 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    showNote('');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    try{
      const response = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });

      if(response.ok){
        form.hidden = true;
        successEl.hidden = false;
      } else {
        const data = await response.json().catch(() => null);
        const message = (data && Array.isArray(data.errors) && data.errors.length)
          ? data.errors.map(err => err.message).join(' ')
          : 'Something went wrong sending your message. Please try again, or email me directly below.';
        showNote(message, true);
        submitBtn.disabled = false;
        submitBtn.textContent = submitBtnDefaultLabel;
      }
    } catch(err){
      showNote('Something went wrong sending your message. Please check your connection and try again, or email me directly below.', true);
      submitBtn.disabled = false;
      submitBtn.textContent = submitBtnDefaultLabel;
    }
  });
}

document.addEventListener('click', (e) => {
  const link = e.target.closest('[data-link]');
  if(link){
    // let default hash navigation happen, but animate the swap
    setTimeout(navigateWithTransition, 0);
  }
});

window.addEventListener('hashchange', render);
document.getElementById('year').textContent = new Date().getFullYear();

const siteHeader = document.querySelector('header.site-header');
function updateHeaderState(){
  siteHeader.classList.toggle('scrolled', window.scrollY > 40);
}
window.addEventListener('scroll', updateHeaderState, { passive:true });
updateHeaderState();

/* ---------- Mobile menu ---------- */
const menuToggle = document.getElementById('menuToggle');
const mainNav = document.getElementById('mainNav');
function setNavOpen(open){
  siteHeader.classList.toggle('nav-open', open);
  document.body.classList.toggle('menu-open', open);
  menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
}
menuToggle.addEventListener('click', () => {
  setNavOpen(!siteHeader.classList.contains('nav-open'));
});
mainNav.addEventListener('click', (e) => {
  if(e.target.closest('a[data-link]')) setNavOpen(false);
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') setNavOpen(false);
});
window.addEventListener('hashchange', () => setNavOpen(false));

/* =====================================================================
   IMAGE PROTECTION — deterrents against casual downloading. These are
   delegated listeners on document, so they automatically cover every
   <img> on the site — on any page, in any order, including photos
   added/removed/reordered later via the CMS — without needing to be
   wired up per-image or re-attached on re-render.

   Note: this only raises the bar against casual downloading (right-click
   save, drag-to-desktop, page save, quick devtools shortcuts). No
   client-side measure can fully stop a determined user, since the
   browser must still receive the image bytes to display them.
===================================================================== */
document.addEventListener('contextmenu', (e) => {
  if(e.target.closest('img')) e.preventDefault();
});
document.addEventListener('dragstart', (e) => {
  if(e.target.closest('img')) e.preventDefault();
});
document.addEventListener('keydown', (e) => {
  const key = e.key ? e.key.toLowerCase() : '';
  const mod = e.ctrlKey || e.metaKey;
  const blocked =
    (mod && key === 's') ||                       // Save Page As
    (mod && key === 'u') ||                        // View Source
    key === 'f12' ||                                // DevTools
    (mod && e.shiftKey && ['i','j','c'].includes(key)); // DevTools panels
  if(blocked) e.preventDefault();
});

/* =====================================================================
   INIT — fetch content.json (managed via Pages CMS), populate COLLECTIONS,
   then do the first render. Everything above this point is unchanged.
===================================================================== */
async function init(){
  try{
    const res = await fetch('content.json');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    data.collections.forEach(c => { COLLECTIONS[c.slug] = c; });
    if(data.site) SITE = { ...SITE, ...data.site };
  } catch(err){
    console.error('Could not load content.json:', err);
    app.innerHTML = `
      <div class="page-hero reveal is-visible">
        <div class="eyebrow">Content unavailable</div>
        <h1 class="serif">content.json could not be loaded.</h1>
        <p>Make sure content.json is in the same folder as index.html and that
        you're viewing this over http(s) — e.g. via GitHub Pages, or a local
        server — rather than opening the file directly, since browsers block
        fetch() on file:// URLs.</p>
      </div>`;
    return;
  }
  render();
}

init();
</script>
