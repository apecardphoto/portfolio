<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexander Pécard-Leese — Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-ivory:#FAF9F6;
    --bg-ivory-deep:#F3F1EB;
    --ink:#2B2926;
    --ink-muted:#5C574F;
    --ink-faint:#8C8577;
    --line:#E6E2D9;
    --line-strong:#D3CDC0;
    --max:1400px;
    --gutter:clamp(20px,4vw,64px);
    --dur:650ms;
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg-ivory);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;padding:0;}

  ::selection{background:var(--ink);color:var(--bg-ivory);}

  /* focus visibility */
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:1.5px solid var(--ink);
    outline-offset:4px;
  }

  .serif{font-family:'Fraunces', serif;}
  .eyebrow{
    font-family:'Work Sans', sans-serif;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-muted);
    font-weight:500;
  }

  /* ---------- Layout shells ---------- */
  .wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter);}

  header.site-header{
    position:fixed;top:0;left:0;right:0;
    z-index:100;
    background:transparent;
    border-bottom:1px solid transparent;
    transition:background-color 500ms var(--ease), border-color 500ms var(--ease);
  }
  header.site-header.scrolled{
    background:var(--bg-ivory);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--max);margin:0 auto;padding:34px var(--gutter) 22px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    transition:padding 500ms var(--ease);
  }
  .scrolled .header-inner{padding:20px var(--gutter) 16px;}
  .brand{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-style:normal;
    font-size:clamp(26px,3.6vw,42px);
    letter-spacing:.002em;
    line-height:1;
    white-space:nowrap;
    transition:font-size 500ms var(--ease);
  }
  .scrolled .brand{font-size:clamp(19px,2vw,24px);}
  .brand small{
    display:block;
    font-family:'Work Sans', sans-serif;
    font-style:normal;
    font-size:10px;
    letter-spacing:.28em;
    color:var(--ink-muted);
    font-weight:400;
    margin-top:8px;
    text-transform:uppercase;
    transition:opacity 400ms var(--ease), margin 400ms var(--ease), font-size 400ms var(--ease);
  }
  .scrolled .brand small{opacity:0;margin-top:0;font-size:0;}
  nav.main-nav{
    display:flex;gap:clamp(16px,2.4vw,34px);
    font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
    padding-bottom:4px;
  }
  nav.main-nav .nav-item{position:relative;}
  nav.main-nav a, nav.main-nav .nav-label{
    padding:6px 0;display:inline-block;position:relative;
    color:var(--ink-muted);
    transition:color .3s var(--ease);
    cursor:pointer;
  }
  nav.main-nav a.active, nav.main-nav a:hover, nav.main-nav .nav-label:hover{color:var(--ink);}
  nav.main-nav a::after{
    content:'';position:absolute;left:0;right:0;bottom:2px;height:1px;
    background:var(--ink);transform:scaleX(0);transform-origin:left;
    transition:transform .35s var(--ease);
  }
  nav.main-nav a.active::after, nav.main-nav a:hover::after{transform:scaleX(1);}

  .sub-panel{
    position:absolute;top:100%;left:-8px;padding-top:16px;
    display:none;flex-direction:column;gap:10px;min-width:180px;
  }
  .nav-item:hover .sub-panel, .nav-item:focus-within .sub-panel{display:flex;}
  .sub-panel a{color:var(--ink-muted);font-size:11.5px;letter-spacing:.06em;}
  .sub-panel a:hover{color:var(--ink);}

  .menu-toggle{display:none;}

  main{padding-top:0;}

  /* ---------- Mobile navigation (mobile only — desktop nav above is untouched) ---------- */
  @media (max-width:760px){
    .header-inner{align-items:center;}

    .menu-toggle{
      display:inline-flex;align-items:center;justify-content:center;
      width:30px;height:30px;padding:0;
      background:none;border:none;cursor:pointer;
      z-index:110;position:relative;
    }
    .menu-toggle-bars{
      display:inline-flex;flex-direction:column;justify-content:center;gap:5px;width:20px;
    }
    .menu-toggle-bars span{
      display:block;height:1px;width:100%;background:var(--ink);
      transition:transform .35s var(--ease), opacity .25s var(--ease);
    }
    header.site-header.nav-open .menu-toggle-bars span:nth-child(1){transform:translateY(6px) rotate(45deg);}
    header.site-header.nav-open .menu-toggle-bars span:nth-child(2){opacity:0;}
    header.site-header.nav-open .menu-toggle-bars span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}

    nav.main-nav{
      position:fixed;top:0;left:0;right:0;bottom:0;z-index:105;
      flex-direction:column;align-items:flex-start;justify-content:center;
      gap:28px;
      background:var(--bg-ivory);
      padding:110px var(--gutter) 70px;
      font-size:16px;
      overflow-y:auto;
      opacity:0;visibility:hidden;pointer-events:none;
      transform:translateY(-10px);
      transition:opacity .4s var(--ease), transform .4s var(--ease), visibility 0s linear .4s;
    }
    header.site-header.nav-open nav.main-nav{
      opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0);
      transition:opacity .4s var(--ease), transform .4s var(--ease), visibility 0s linear 0s;
    }
    nav.main-nav .nav-item{width:100%;}
    nav.main-nav a, nav.main-nav .nav-label{
      padding:12px 0;font-size:16px;display:block;width:100%;
    }
    .sub-panel{
      position:static;display:flex !important;flex-direction:column;
      padding:6px 0 4px 20px;gap:14px;min-width:0;
    }
    .sub-panel a{font-size:14px;padding:0;}

    body.menu-open{overflow:hidden;}
  }

  footer.site-footer{
    border-top:1px solid var(--line);
    margin-top:120px;
    padding:36px var(--gutter) 48px;
  }
  .footer-inner{
    max-width:var(--max);margin:0 auto;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
    font-size:11.5px;letter-spacing:.06em;color:var(--ink-muted);
    text-transform:uppercase;
  }
  .footer-inner .social a{margin-left:20px;}
  .footer-inner .social a:hover{color:var(--ink);}

  /* ---------- Fade-in on scroll ---------- */
  .reveal{opacity:0;transform:translateY(22px);transition:opacity 900ms var(--ease), transform 900ms var(--ease);}
  .reveal.is-visible{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;transition:none;}
    html{scroll-behavior:auto;}
  }

  /* ---------- View transition ---------- */
  #app{opacity:1;transition:opacity 420ms ease;}
  #app.leaving{opacity:0;}

  /* ---------- Home hero spacer ---------- */
  .home-top-space{height:min(34vh,260px);}

  /* ---------- Editorial grid ---------- */
  .sequence{
    max-width:var(--max);margin:0 auto;padding:0 var(--gutter);
    display:grid;grid-template-columns:repeat(12,1fr);
    column-gap:var(--gutter);row-gap:clamp(40px,7vw,96px);
    margin-bottom:clamp(40px,7vw,96px);
  }
  .tile{position:relative;}
  .tile-frame{overflow:hidden;background:var(--line);}
  .tile-frame img{
    width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(18%) sepia(6%) contrast(.98) brightness(1.02);
    transform:scale(1.001);
    transition:transform 1.1s var(--ease);
  }
  .tile a{display:block;cursor:pointer;}
  .tile a:hover .tile-frame img{transform:scale(1.035);}

  .tile--full{grid-column:1/13;}
  .tile--full .tile-frame{aspect-ratio:16/9.2;}
  .tile--large{grid-column:1/8;}
  .tile--large .tile-frame{aspect-ratio:4/5;}
  .tile--medium{grid-column:1/6;}
  .tile--medium .tile-frame{aspect-ratio:4/5;}
  .tile--small{grid-column:1/5;}
  .tile--small .tile-frame{aspect-ratio:3/4;}
  .tile--pairL{grid-column:1/7;}
  .tile--pairR{grid-column:7/13;}
  .tile--pairR .tile-frame, .tile--pairL .tile-frame{aspect-ratio:4/5;}
  .tile--pair-low{margin-top:clamp(40px,9vw,120px);}
  .tile--offsetR{grid-column:6/13;}
  .tile--offsetR .tile-frame{aspect-ratio:5/4;}

  .tile-caption{
    margin-top:14px;display:flex;justify-content:space-between;gap:16px;
    font-size:11.5px;color:var(--ink-muted);letter-spacing:.04em;
  }
  .tile-caption .t-title{font-family:'Fraunces', serif;font-style:italic;font-size:15px;color:var(--ink);letter-spacing:0;}
  .tile-caption .t-meta{white-space:nowrap;text-transform:uppercase;padding-top:2px;}

  .quiet-label{
    grid-column:1/13;text-align:left;margin:0 0 -20px;
  }

  @media (max-width:860px){
    .sequence{row-gap:56px;}
    .tile--full,.tile--large,.tile--medium,.tile--small,.tile--pairL,.tile--pairR,.tile--offsetR,.tile--pair-low{
      grid-column:1/13;margin-top:0;
    }
    .tile--full .tile-frame{aspect-ratio:4/5;}
  }

  /* ---------- Page intros ---------- */
  .page-hero{
    padding:190px var(--gutter) 60px;
    max-width:var(--max);margin:0 auto;
  }
  .page-hero .eyebrow{margin-bottom:18px;}
  .page-hero h1{
    font-family:'Fraunces', serif;font-weight:400;font-style:italic;
    font-size:clamp(34px,5.4vw,66px);line-height:1.05;margin:0 0 22px;
    max-width:16ch;
  }
  .page-hero p{
    font-size:15px;line-height:1.8;color:var(--ink-muted);max-width:52ch;margin:0;
  }

  /* ---------- Work index ---------- */
  .work-index{
    max-width:var(--max);margin:0 auto;padding:190px var(--gutter) 40px;
  }
  .work-index-list{margin-top:40px;}
  .work-row{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:34px 0;border-top:1px solid var(--line);
    transition:padding-left .4s var(--ease);
  }
  .work-row:last-child{border-bottom:1px solid var(--line);}
  .work-row a{display:flex;align-items:baseline;justify-content:space-between;width:100%;}
  .work-row h2{
    font-family:'Fraunces', serif;font-weight:400;font-size:clamp(26px,4vw,44px);margin:0;
    transition:transform .45s var(--ease);
  }
  .work-row:hover h2{transform:translateX(14px);}
  .work-row .count{font-size:11.5px;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase;}

  /* ---------- Individual image page ---------- */
  .artwork{
    max-width:var(--max);margin:0 auto;padding:172px var(--gutter) 0;
  }
  .artwork-image{
    background:var(--line);overflow:hidden;margin-bottom:36px;
  }
  .artwork-image img{width:100%;display:block;filter:grayscale(18%) sepia(6%) contrast(.98) brightness(1.02);}
  .artwork-meta-row{
    display:grid;grid-template-columns:1.3fr .7fr;gap:60px;
    padding-bottom:100px;border-bottom:1px solid var(--line);margin-bottom:70px;
  }
  .artwork-title{font-family:'Fraunces', serif;font-style:italic;font-weight:400;font-size:clamp(26px,3.4vw,38px);margin:0 0 10px;}
  .artwork-location{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:26px;}
  .artwork-desc{font-size:15px;line-height:1.85;color:var(--ink-muted);max-width:56ch;}
  .artwork-side dl{margin:0 0 30px;}
  .artwork-side dt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px;}
  .artwork-side dd{margin:0 0 18px;font-size:13.5px;color:var(--ink);}
  .print-btn{
    display:inline-block;padding:15px 26px;border:1px solid var(--ink);
    font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
    transition:background .3s var(--ease), color .3s var(--ease);
  }
  .print-btn:hover{background:var(--ink);color:var(--bg-ivory);}
  .back-link{
    display:inline-block;margin-bottom:40px;font-size:11.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-muted);
  }
  .back-link:hover{color:var(--ink);}
  @media (max-width:760px){
    .artwork-meta-row{grid-template-columns:1fr;gap:36px;padding-bottom:60px;}
  }

  /* ---------- About ---------- */
  .about-wrap{max-width:900px;margin:0 auto;padding:190px var(--gutter) 40px;}
  .about-portrait{
    aspect-ratio:4/5;max-width:420px;background:var(--line);overflow:hidden;margin-bottom:56px;
  }
  .about-portrait img{width:100%;height:100%;object-fit:cover;filter:grayscale(22%) sepia(6%) contrast(.98);}
  .about-wrap h1{font-family:'Fraunces', serif;font-style:italic;font-weight:400;font-size:clamp(28px,4vw,44px);margin:0 0 34px;}
  .about-wrap p{font-size:16px;line-height:1.95;color:var(--ink-muted);margin:0 0 26px;max-width:60ch;}
  .about-wrap p:first-of-type::first-letter{
    font-family:'Fraunces', serif;font-size:3.4em;float:left;line-height:.8;padding-right:10px;padding-top:6px;color:var(--ink);
  }

  /* ---------- Prints page ---------- */
  .prints-wrap{max-width:var(--max);margin:0 auto;padding:190px var(--gutter) 40px;}
  .prints-body{display:grid;grid-template-columns:1.1fr .9fr;gap:80px;padding-bottom:80px;}
  .prints-body p{font-size:15.5px;line-height:1.9;color:var(--ink-muted);margin:0 0 22px;max-width:56ch;}
  .prints-note{
    border:1px solid var(--line);padding:32px;font-size:13px;line-height:1.8;color:var(--ink-muted);
  }
  .prints-note .eyebrow{margin-bottom:14px;}
  @media (max-width:860px){.prints-body{grid-template-columns:1fr;gap:40px;}}

  /* ---------- Contact ---------- */
  .contact-wrap{max-width:760px;margin:0 auto;padding:190px var(--gutter) 40px;}
  .contact-wrap h1{font-family:'Fraunces', serif;font-style:italic;font-weight:400;font-size:clamp(28px,4vw,44px);margin:0 0 20px;}
  .contact-wrap > p{font-size:15px;line-height:1.8;color:var(--ink-muted);margin:0 0 56px;max-width:52ch;}
  .field{margin-bottom:30px;}
  .field label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;}
  .field input, .field textarea, .field select{
    width:100%;border:none;border-bottom:1px solid var(--line-strong);
    background:transparent;font-family:'Work Sans', sans-serif;font-size:15px;color:var(--ink);
    padding:8px 0;font-weight:300;border-radius:0;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-bottom-color:var(--ink);}
  .field textarea{resize:vertical;min-height:100px;}
  .field select{
    -webkit-appearance:none;-moz-appearance:none;appearance:none;
    cursor:pointer;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%235C574F"/></svg>');
    background-repeat:no-repeat;background-position:right 2px center;background-size:10px 6px;
    padding-right:20px;
  }
  .field select:invalid{color:var(--ink-faint);}
  .contact-submit{margin-top:10px;transition:opacity .3s var(--ease);}
  .contact-submit[disabled]{opacity:.5;cursor:default;}
  .contact-direct{
    margin-top:70px;padding-top:36px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;
  }
  .contact-direct .eyebrow{margin-bottom:8px;}
  .contact-direct a{font-size:15px;}
  .contact-direct a:hover{color:var(--ink-muted);}

  .form-note{font-size:12px;color:var(--ink-faint);margin-top:16px;font-style:italic;}
  .form-note--error{color:#8B4A3B;font-style:normal;}

  .contact-success h2{
    font-family:'Fraunces', serif;font-style:italic;font-weight:400;
    font-size:clamp(24px,3vw,32px);margin:14px 0 14px;
  }
  .contact-success p{font-size:15px;line-height:1.85;color:var(--ink-muted);max-width:48ch;margin:0;}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#/" class="brand" data-link>Alexander Pécard-Leese
      <small>Fine Art Photography</small>
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav">
      <span class="menu-toggle-bars"><span></span><span></span><span></span></span>
    </button>
    <nav class="main-nav" id="mainNav">
      <div class="nav-item"><a href="#/" data-link data-route="/">Home</a></div>
      <div class="nav-item">
        <a href="#/work" data-link data-route="/work">Work</a>
        <div class="sub-panel">
          <a href="#/work/portraits" data-link data-route="/work/portraits">Portraits</a>
          <a href="#/work/landscape" data-link data-route="/work/landscape">Landscape &amp; Travel</a>
          <a href="#/work/automotive" data-link data-route="/work/automotive">Automotive</a>
        </div>
      </div>
      <div class="nav-item"><a href="#/prints" data-link data-route="/prints">Prints</a></div>
      <div class="nav-item"><a href="#/about" data-link data-route="/about">About</a></div>
      <div class="nav-item"><a href="#/contact" data-link data-route="/contact">Contact</a></div>
    </nav>
  </div>
</header>

<main>
  <div id="app"></div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>&copy; <span id="year"></span> Alexander Pécard-Leese</span>
    <span class="social">
      <a href="https://www.instagram.com/apecardphoto" target="_blank" rel="noopener">Instagram</a>
      <a href="#" target="_blank" rel="noopener">Are.na</a>
    </span>
  </div>
</footer>

<script>
/* =====================================================================
   CONTENT LAYER — this block is the stand-in for the future Sanity CMS.
   Shape mirrors the planned schema: Collection { title, slug, intro,
   photos[] }, Photograph { title, location, year, description, camera,
   lens, printLink, size, featured }.
   Placeholder imagery only — final build wires this to real uploads.
===================================================================== */

// COLLECTIONS is populated at runtime from content.json (see init() below).
// This keeps every render function below completely unchanged — they just
// read from COLLECTIONS once it's been filled in.
let COLLECTIONS = {};
let SITE = { aboutPortrait: "images/profile.jpg" };

// Manual homepage sequence — the CMS equivalent of a "featured" checkbox
// plus an editor-controlled layout hint per item, so pacing stays
// art-directed rather than auto-generated.
const HOME_SEQUENCE = [
  { ref:["landscape","l1"], size:"full" },
  { pair:[ ["portraits","p2"], ["automotive","a3"] ] },
  { ref:["automotive","a2"], size:"full" },
  { pair:[ ["landscape","l4"], ["portraits","p5"] ] },
  { ref:["portraits","p4"], size:"full" },
  { pair:[ ["automotive","a1"], ["landscape","l3"] ] },
];

function getPhoto(collectionKey, photoId){
  const c = COLLECTIONS[collectionKey];
  const p = c.photos.find(ph => ph.id === photoId);
  return { ...p, collectionKey, collectionTitle: c.title };
}

/* =====================================================================
   RENDER HELPERS
===================================================================== */

function tileMarkup(photo, sizeClass, showCaption=true){
  return `
    <div class="tile tile--${sizeClass} reveal">
      <a href="#/work/${photo.collectionKey}/${photo.id}" data-link>
        <div class="tile-frame"><img src="${photo.image}" alt="${photo.title}, ${photo.location}" loading="lazy"></div>
      </a>
      ${showCaption ? `
      <div class="tile-caption">
        <span class="t-title">${photo.title}</span>
        <span class="t-meta">${photo.location.split(',')[0]} — ${photo.year}</span>
      </div>` : ``}
    </div>`;
}

function renderHome(){
  let html = `<div class="home-top-space"></div><div class="sequence">`;
  let labelPlaced = false;
  let pairCount = 0;

  HOME_SEQUENCE.forEach((entry, idx) => {
    if(entry.ref){
      const [ck, pid] = entry.ref;
      const photo = getPhoto(ck, pid);
      if(!labelPlaced && idx > 0){
        html += `<div class="quiet-label eyebrow reveal">Selected Works</div>`;
        labelPlaced = true;
      }
      html += tileMarkup(photo, entry.size === "full" ? "full" : entry.size);
    } else if(entry.pair){
      const [a, b] = entry.pair;
      const pa = getPhoto(a[0], a[1]);
      const pb = getPhoto(b[0], b[1]);
      // alternate which side sits lower from one pair to the next,
      // rather than always dropping the right image
      const leftLow = pairCount % 2 === 1;
      pairCount++;
      html += `<div class="tile tile--pairL${leftLow ? ' tile--pair-low' : ''} reveal">
        <a href="#/work/${pa.collectionKey}/${pa.id}" data-link>
          <div class="tile-frame"><img src="${pa.image}" alt="${pa.title}, ${pa.location}" loading="lazy"></div>
        </a>
        <div class="tile-caption"><span class="t-title">${pa.title}</span><span class="t-meta">${pa.location.split(',')[0]} — ${pa.year}</span></div>
      </div>`;
      html += `<div class="tile tile--pairR${leftLow ? '' : ' tile--pair-low'} reveal">
        <a href="#/work/${pb.collectionKey}/${pb.id}" data-link>
          <div class="tile-frame"><img src="${pb.image}" alt="${pb.title}, ${pb.location}" loading="lazy"></div>
        </a>
        <div class="tile-caption"><span class="t-title">${pb.title}</span><span class="t-meta">${pb.location.split(',')[0]} — ${pb.year}</span></div>
      </div>`;
    }
  });

  html += `</div>`;
  return html;
}

function renderWorkIndex(){
  const rows = Object.values(COLLECTIONS).map(c => `
    <div class="work-row reveal">
      <a href="#/work/${c.slug}" data-link>
        <h2 class="serif">${c.title}</h2>
        <span class="count">${String(c.photos.length).padStart(2,'0')} works</span>
      </a>
    </div>`).join('');

  return `
    <div class="page-hero reveal">
      <div class="eyebrow">Work</div>
      <h1 class="serif">Three bodies of work, ongoing.</h1>
      <p>Each collection is its own study — of people, of places, of machines built by hand. None are finished; all are added to as the work continues.</p>
    </div>
    <div class="work-index-list wrap">${rows}</div>
    <div style="height:60px"></div>
  `;
}

function renderCollection(slug){
  const c = COLLECTIONS[slug];
  if(!c) return renderNotFound();

  let html = `
    <div class="page-hero reveal">
      <div class="eyebrow">Work — ${c.title}</div>
      <h1 class="serif">${c.title}</h1>
      <p>${c.intro}</p>
    </div>
    <div class="sequence">`;

  c.photos.forEach((p, i) => {
    const photo = { ...p, collectionKey: slug };
    if(p.size === "full"){
      html += tileMarkup(photo, "full");
    } else {
      // pair consecutive medium/small/large items when possible for editorial rhythm
      html += tileMarkup(photo, p.size);
    }
  });

  html += `</div><div style="height:40px"></div>`;
  return html;
}

function renderArtwork(collectionKey, photoId){
  const c = COLLECTIONS[collectionKey];
  if(!c) return renderNotFound();
  const photo = c.photos.find(p => p.id === photoId);
  if(!photo) return renderNotFound();

  return `
    <div class="artwork">
      <a class="back-link reveal" href="#/work/${collectionKey}" data-link>&larr; ${c.title}</a>
      <div class="artwork-image reveal">
        <img src="${photo.image.replace(/\/\d+\/\d+$/, '/1800/1150')}" alt="${photo.title}, ${photo.location}">
      </div>
      <div class="artwork-meta-row reveal">
        <div class="artwork-main">
          <h1 class="artwork-title">${photo.title}</h1>
          <div class="artwork-location">${photo.location} — ${photo.year}</div>
          <p class="artwork-desc">${photo.description}</p>
        </div>
        <div class="artwork-side">
          <dl>
            <dt>Camera</dt><dd>${photo.camera}</dd>
            <dt>Lens</dt><dd>${photo.lens}</dd>
            <dt>Collection</dt><dd>${c.title}</dd>
          </dl>
          ${photo.printLink ? `
          <div class="eyebrow" style="margin-bottom:14px;">Available as a fine-art print</div>
          <a class="print-btn" href="${photo.printLink}" target="_blank" rel="noopener">View Print Options</a>
          ` : ``}
        </div>
      </div>
    </div>
  `;
}

function renderAbout(){
  return `
    <div class="about-wrap">
      <div class="about-portrait reveal">
        <img src="${SITE.aboutPortrait}" alt="Alexander Pécard-Leese">
      </div>
      <h1 class="reveal">On light, and waiting for it.</h1>
      <div class="reveal">
        <p>I've come to think of a camera as a slow instrument, even when the shutter is fast. Most of what happens before a photograph is made is attention — to a room, a coastline, a face — long enough that whatever is true about it has a chance to appear on its own terms.</p>
        <p>I work across three subjects that don't, on the surface, have much in common: people, landscapes, and cars. What connects them is a working method rather than a style — I try to arrive early, stay longer than seems necessary, and photograph only once the obvious version of the scene has passed.</p>
        <p>I'm not especially interested in decisive moments. I'm interested in the ordinary minutes on either side of them, which is usually where the actual subject is standing.</p>
      </div>
    </div>
  `;
}

function renderPrints(){

    <div class="prints-wrap">
      <div class="page-hero reveal" style="padding:0 0 50px;">
        <div class="eyebrow">Prints</div>

      <div class="prints-body">

/* =====================================================================
   ROUTER
===================================================================== */
const app = document.getElementById('app');

function parseRoute(){
  const hash = location.hash.replace(/^#/, '') || '/';
  const parts = hash.split('/').filter(Boolean);
  return parts;
}

function render(){
  const parts = parseRoute();
  let html = '';

  if(parts.length === 0){
    html = renderHome();
  } else if(parts[0] === 'work' && parts.length === 1){
    html = renderWorkIndex();
  } else if(parts[0] === 'work' && parts.length === 2){
    html = renderCollection(parts[1]);
  } else if(parts[0] === 'work' && parts.length === 3){
    html = renderArtwork(parts[1], parts[2]);
  } else if(parts[0] === 'prints'){
    html = renderPrints();
  } else if(parts[0] === 'about'){
    html = renderAbout();
  } else if(parts[0] === 'contact'){
    html = renderContact();
  } else {
    html = renderNotFound();
  }

  app.innerHTML = html;
  updateActiveNav(parts);
  attachScrollReveal();
  attachContactForm();
  window.scrollTo(0,0);
  document.querySelector('header.site-header').classList.remove('scrolled');
}

function navigateWithTransition(){
  app.classList.add('leaving');
  setTimeout(() => {
    render();
    app.classList.remove('leaving');
  }, 220);
}

function updateActiveNav(parts){
  const route = '/' + parts.join('/');
  document.querySelectorAll('nav.main-nav a[data-route]').forEach(a => {
    const r = a.getAttribute('data-route');
    a.classList.toggle('active', r === route || (r !== '/' && route.startsWith(r)));
  });
}

function attachScrollReveal(){
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){
    els.forEach(el => el.classList.add('is-visible'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  els.forEach(el => io.observe(el));
}

function attachContactForm(){
  const form = document.getElementById('contactForm');
  if(!form) return;

  const submitBtn = form.querySelector('.contact-submit');
  const noteEl = document.getElementById('formNote');
  const successEl = document.getElementById('contactSuccess');
  const submitBtnDefaultLabel = submitBtn.textContent;

  function showNote(message, isError){
    noteEl.textContent = message;
    noteEl.classList.toggle('form-note--error', !!isError);
    noteEl.style.display = message ? 'block' : 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    showNote('');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    try{
      const response = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });

      if(response.ok){
        form.hidden = true;
        successEl.hidden = false;
      } else {
        const data = await response.json().catch(() => null);
        const message = (data && Array.isArray(data.errors) && data.errors.length)
          ? data.errors.map(err => err.message).join(' ')
          : 'Something went wrong sending your message. Please try again, or email me directly below.';
        showNote(message, true);
        submitBtn.disabled = false;
        submitBtn.textContent = submitBtnDefaultLabel;
      }
    } catch(err){
      showNote('Something went wrong sending your message. Please check your connection and try again, or email me directly below.', true);
      submitBtn.disabled = false;
      submitBtn.textContent = submitBtnDefaultLabel;
    }
  });
}

document.addEventListener('click', (e) => {
  const link = e.target.closest('[data-link]');
  if(link){
    // let default hash navigation happen, but animate the swap
    setTimeout(navigateWithTransition, 0);
  }
});

window.addEventListener('hashchange', render);
document.getElementById('year').textContent = new Date().getFullYear();

const siteHeader = document.querySelector('header.site-header');
function updateHeaderState(){
  siteHeader.classList.toggle('scrolled', window.scrollY > 40);
}
window.addEventListener('scroll', updateHeaderState, { passive:true });
updateHeaderState();

/* ---------- Mobile menu ---------- */
const menuToggle = document.getElementById('menuToggle');
const mainNav = document.getElementById('mainNav');
function setNavOpen(open){
  siteHeader.classList.toggle('nav-open', open);
  document.body.classList.toggle('menu-open', open);
  menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
}
menuToggle.addEventListener('click', () => {
  setNavOpen(!siteHeader.classList.contains('nav-open'));
});
mainNav.addEventListener('click', (e) => {
  if(e.target.closest('a[data-link]')) setNavOpen(false);
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') setNavOpen(false);
});
window.addEventListener('hashchange', () => setNavOpen(false));

/* =====================================================================
   INIT — fetch content.json (managed via Pages CMS), populate COLLECTIONS,
   then do the first render. Everything above this point is unchanged.
===================================================================== */
async function init(){
  try{
    const res = await fetch('content.json');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    data.collections.forEach(c => { COLLECTIONS[c.slug] = c; });
    if(data.site) SITE = { ...SITE, ...data.site };
  } catch(err){
    console.error('Could not load content.json:', err);
    app.innerHTML = `
      <div class="page-hero reveal is-visible">
        <div class="eyebrow">Content unavailable</div>
        <h1 class="serif">content.json could not be loaded.</h1>
        <p>Make sure content.json is in the same folder as index.html and that
        you're viewing this over http(s) — e.g. via GitHub Pages, or a local
        server — rather than opening the file directly, since browsers block
        fetch() on file:// URLs.</p>
      </div>`;
    return;
  }
  render();
}

init();
</script>
